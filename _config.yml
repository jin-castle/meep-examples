title: Meep Examples
description: 그림과 실행 코드로 배우는 Meep(FDTD) 예제 백과. Korean and English lessons, from light sources to inverse design and optical beams.
url: "https://jin-castle.github.io"
baseurl: "/meep-examples"
author: jin-castle
github_username: jin-castle
lang: ko

analytics:
  measurement_id: "G-4BL7PWF8YR"
google_site_verification: "ZTgdMI-VxazYvc9Z4PoBJ5ZIHx3yBJkNLMqvZEREiOY"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

permalink: /:title/
show_excerpts: true

minima:
  date_format: "%Y-%m-%d"

exclude:
  - DESIGN.md
  - README.md
  - ANALYTICS.md
  - Gemfile
  - Gemfile.lock
