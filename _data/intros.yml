# Intro videos (assets/meep/NN/00_intro.mp4 + .jpg), keyed by the post's part as two digits.
# label: what the video shows (aria-label). note: one honest line under the video (what is computed, what is display only).
# Sources: Desktop\meep_intro (scenes, field exporters); fields are re-recorded with each post's own simulation parameters.
"01":
  label: "빈 진공 셀에서 점원과 3 µm 선원이 내보내는 파면"
  note: "빈 진공 셀(12 × 12 µm, PML 없음)의 점원(왼쪽)과 3 µm 선원(오른쪽), 이 글의 Meep 계산 Re(Ez)입니다(빨강 −, 파랑 +). 2D 점원은 화면에 수직인 선전류라 막대로 그렸고, 높이는 표시용입니다."
  label_en: "Wavefronts from a point source and a 3 µm line source in an empty vacuum cell"
  note_en: "A point source (left) and a 3 µm line source (right) in an empty 12 × 12 µm vacuum cell without PML: Re(Ez) from this chapter's Meep run (red −, blue +). A 2D point source is a line current out of the page, so it is drawn as a rod; the height is for display."
"02":
  label: "반사 경계와 PML 경계에서 같은 점원이 만드는 장"
  note: "같은 점원을 반사 경계(왼쪽)와 PML 1 µm(오른쪽)로 계산한 Re(Ez)입니다(빨강 −, 파랑 +). 셀은 12 × 8 µm이고, 2D 계산이라 높이는 표시용입니다."
  label_en: "The same point source with a reflecting boundary and with a PML"
  note_en: "The same point source with a reflecting boundary (left) and a 1 µm PML (right), Re(Ez) (red −, blue +) in a 12 × 8 µm cell. The simulation is 2D, so the height is for display."
"03":
  label: "입사장, 원기둥이 있는 전체장, 둘의 차인 산란장"
  note: "입사장(물체 없음), 전체장(n = 2, r = 0.75 µm 원기둥), 산란장(전체 − 입사)의 Re(Ez)입니다. 세 장은 각자 최댓값으로 색 범위를 잡았고, 2D 계산이라 높이는 표시용입니다."
  label_en: "Incident field, total field with the cylinder, and their difference, the scattered field"
  note_en: "Incident field (no object), total field (n = 2 cylinder, r = 0.75 µm) and scattered field (total − incident), Re(Ez). Each panel uses its own maximum for the colour range; the simulation is 2D, so the height is for display."
"04":
  label: "SiO2 클래딩 안 Si 스트립 도파관 코어를 지나가는 TE0 펄스"
  note: "구조 치수는 글의 시뮬레이션 그대로이고, 장은 이 글의 Meep 계산 Re(Ey)입니다(빨강 −, 파랑 +). 계산이 2D라 높이는 표시용이고, 장은 높이 방향으로 같습니다."
  label_en: "A TE0 pulse travelling through a Si strip waveguide core in SiO2 cladding"
  note_en: "Dimensions follow this chapter's simulation; the field is Re(Ey) from its Meep run (red −, blue +). The simulation is 2D, so the height is for display and the field is the same at every height."
"05":
  label: "유전체 도파관의 날카로운 90° 굽힘과 둥근 굽힘을 지나는 펄스"
  note: "ε = 12 도파관(폭 0.23 µm)의 날카로운 모서리(왼쪽)와 반경 0.70 µm 굽힘(오른쪽), 이 글의 Meep 계산 Re(Ez)입니다. 2D 계산이라 높이는 표시용입니다."
  label_en: "A pulse through a sharp and a rounded 90° bend of a dielectric waveguide"
  note_en: "A sharp corner (left) and a 0.70 µm radius bend (right) of an ε = 12 waveguide 0.23 µm wide, Re(Ez) from this chapter's Meep run. The simulation is 2D, so the height is for display."
"06":
  label: "유리 ridge 8개짜리 binary grating을 지나 갈라지는 평면파"
  note: "유리 기판 위 ridge 8개(0.5 × 1.3 µm, 주기 2.6 µm)를 지나는 평면파, 이 글의 Meep 계산 Re(Ez)입니다. 2D 계산이라 높이는 표시용입니다."
  label_en: "A plane wave splitting behind an eight-ridge binary grating"
  note_en: "A plane wave through eight glass ridges (0.5 × 1.3 µm, period 2.6 µm) on a glass substrate, Re(Ez) from this chapter's Meep run. The simulation is 2D, so the height is for display."
"07":
  label: "폭이 다른 Si meta-atom 12개를 지나 비스듬히 기우는 파면"
  note: "폭 4가지 Si 막대 12개(0.45 µm 간격, 높이 0.9 µm)를 지나 59.4° 쪽으로 기우는 파면, 이 글의 Meep 계산 Re(Ez)입니다. 2D 계산이라 화면의 두께는 표시용입니다."
  label_en: "A wavefront tilting after twelve Si meta-atoms of different widths"
  note_en: "Twelve Si bars of four widths (0.45 µm pitch, 0.9 µm tall) tilt the wavefront toward 59.4°, Re(Ez) from this chapter's Meep run. The simulation is 2D, so the thickness on screen is for display."
"08":
  label: "최적화된 metagrating 5주기를 지나 꺾이는 파면"
  note: "최적화한 density(주기 1.8 µm당 73픽셀)를 5주기 늘어놓은 구조이고, 금색 막대의 두께가 density입니다. 장은 이 글의 Meep 계산 Re(Ez)이고, 2D 계산이라 두께는 표시용입니다."
  label_en: "A wavefront steered by five periods of the optimised metagrating"
  note_en: "The optimised density (73 pixels per 1.8 µm period) repeated over five periods; the thickness of each gold bar is the density. Re(Ez) from this chapter's Meep run; the simulation is 2D, so the thickness is for display."
"09":
  label: "최적화된 1 × 1 µm 설계 영역에서 90° 꺾이는 도파관 모드"
  note: "11 × 11 density(색: SiO2 → Si) 설계 영역을 지나 꺾이는 모드, 글과 같은 해상도 10의 Meep 계산 Re(Ez)입니다. 2D 계산이라 높이는 표시용입니다."
  label_en: "A waveguide mode turning 90° through the optimised 1 × 1 µm design region"
  note_en: "The mode turns through the 11 × 11 density design (colour: SiO2 → Si), Re(Ez) from this chapter's Meep run at the same resolution 10. The simulation is 2D, so the height is for display."
"10":
  label: "금속 거울 위 쌍극자가 내보내는 파면"
  note: "PEC 거울(y = 0) 위 1.25 µm의 쌍극자, 이 글의 Meep 계산 Re(Ez)입니다. 계산은 거울 대신 반대 부호 image dipole로 했으므로 물리적인 위쪽 절반만 보였습니다. 높이는 표시용입니다."
  label_en: "Wavefronts from a dipole above a metal mirror"
  note_en: "A dipole 1.25 µm above a PEC mirror (y = 0), Re(Ez) from this chapter's Meep run. The run replaces the mirror with an opposite-sign image dipole, so only the physical upper half is shown. The height is for display."
"11":
  label: "구멍 하나 뚫린 금속 상자 안의 쌍극자"
  note: "폭 0.4 µm 구멍이 하나 있는 금속 상자(안쪽 1 × 1 µm) 속 쌍극자, 이 글의 Meep 계산 Re(Ez)입니다. 색 범위는 글처럼 |Ez|의 99번째 백분위로 잘랐고, 높이는 표시용입니다."
  label_en: "A dipole inside a metal box with one aperture"
  note_en: "A dipole in a metal box (1 × 1 µm inside) with one 0.4 µm aperture, Re(Ez) from this chapter's Meep run. As in the chapter, the colour range is clipped at the 99th percentile of |Ez|; the height is for display."
"12":
  label: "고리 공진기 안에서 펄스가 지난 뒤 남아 울리는 모드"
  note: "고리(반지름 1–2 µm, n = 3.4) 안 점광원 펄스가 지나간 뒤 높은 Q 모드가 남아 울리는 모습, 이 글의 Meep 계산 Re(Ez)입니다. 2D 계산이라 높이는 표시용입니다."
  label_en: "A mode still ringing in a ring resonator after the pulse has passed"
  note_en: "After the point-source pulse inside the ring (radius 1–2 µm, n = 3.4) has passed, the high-Q mode keeps ringing: Re(Ez) from this chapter's Meep run. The simulation is 2D, so the height is for display."
"13":
  label: "회전체로 계산한 고리의 m = 3 모드"
  note: "12편의 고리를 회전체로 본 반지름 방향 cylindrical 계산(m = 3)의 복소 Ez(r)를 exp(i3φ)로 돌려 보였고, 두 광주기를 반복 재생합니다. 높이는 표시용입니다."
  label_en: "The m = 3 mode of the ring computed as a body of revolution"
  note_en: "Chapter 12's ring as a body of revolution: the complex Ez(r) of the radial cylindrical run (m = 3) is revolved with exp(i3φ), and two optical periods play on repeat. The height is for display."
"14":
  label: "레이저 적층의 쪼갠 면 안쪽 쌍극자에서 공기로 나오는 빛"
  note: "활성층(0.3 µm, n = 2.3) 안, 쪼갠 면에서 0.5 µm 안쪽의 쌍극자입니다. 2D 단면(kz = 0) Meep 계산의 Re(Ez)이고, 높이는 표시용입니다."
  label_en: "Light leaving a dipole inside the cleaved facet of a laser stack"
  note_en: "A dipole in the active layer (0.3 µm, n = 2.3), 0.5 µm behind the cleaved facet. Re(Ez) from the 2D cross-section (kz = 0) Meep run; the height is for display."
"16":
  label: "25개 영역의 유리 영역판 주변 전기장"
  note: "N = 25 유리 영역판 주변의 Meep 복소 Er(r,z)에 m = −1의 각도 위상을 적용한 정상상태 영상입니다(두 광주기 반복). 빨강은 음수, 파랑은 양수이며 z 방향 높이는 8배 확대했습니다. 셀 밖 200 µm 초점은 본문의 near2far 결과로 확인합니다."
  label_en: "The electric field around a 25-zone glass zone plate"
  note_en: "Saved Meep Er(r,z) is revolved with the m = −1 angular phase for two steady-state optical periods. Red is negative; blue is positive. Axial height is enlarged 8×. The focus 200 µm outside the cell is shown in the lesson's near2far results."
"28":
  label: "나란한 두 도파로의 대칭 모드 전기장"
  note: "간격 s/a = 0.5인 두 도파로의 기존 Meep 계산 복소 Ey 단면을 Bloch 위상으로 길이 방향에 펼쳤습니다(fa/c = 0.2, kz·a = 0.38579). 빨강은 음수, 파랑은 양수입니다. 두 광주기를 반복하는 정상상태 위상 시각화이며, 유한한 도파로 길이는 표시용입니다."
  label_en: "The symmetric-mode electric field of two parallel waveguides"
  note_en: "The saved complex Ey cross-section from Meep is extended along two guides using the Bloch phase (s/a = 0.5, fa/c = 0.2, kz·a = 0.38579). Red is negative; blue is positive. Two optical periods repeat as a steady-state phase visualization; the finite guide length is for display."
"17":
  label: "파수 벡터에 수직인 평면파의 파면"
  note: "40° 방향의 k에 수직인 등위상선을 이동시킨 설명용 애니메이션입니다. Meep 계산 영상은 아니며, 본문에서 실제 저장된 Ez와 측정 파수·각도를 비교합니다. 파면의 간격과 표시 속도는 설명용입니다."
  label_en: "Plane-wave fronts perpendicular to the wavevector"
  note_en: "An analytic concept loop of constant-phase lines moving along k at 40°. This is not Meep field data; the lesson compares saved Ez with measured wavevectors and angles. Spacing and playback speed are illustrative."
"18":
  label: "계면에서 반사하고 굴절하는 빛"
  note: "공기에서 n = 3.5 매질로 45° 입사할 때의 반사·굴절 개념 애니메이션입니다. 이동 점은 진행 방향만 표시하며 전력·속도·실제 Meep 장을 나타내지 않습니다. P 편광의 실제 반사율과 오차는 본문에서 확인합니다."
  label_en: "Reflection and refraction at an interface"
  note_en: "A concept animation of 45° incidence from air into n = 3.5. Moving markers show direction, not power, speed or Meep fields. The lesson contains the measured P-polarized reflectance and numerical error."
"20":
  label: "파장별로 달라지는 재료 안의 파장"
  note: "재료 안에서 λ/n만큼 짧아지는 세 파동의 위상 연속성을 보여 주는 해석적 개념 애니메이션입니다. 굴절률 1.43·1.47·1.54는 설명용이며 석영의 피팅값이나 Meep 결과가 아닙니다. 색별 위상은 비교를 위해 같은 주기로 재생하며 실제 주파수·속도 비율을 나타내지 않습니다. 실제 석영 스펙트럼은 본문에서 비교합니다."
  label_en: "Wavelength-dependent phase inside a material"
  note_en: "An analytic concept loop showing continuous phase and wavelength shortened to λ/n inside a material. Indices 1.43, 1.47 and 1.54 are illustrative, not a quartz fit or Meep results. Phases are synchronized for comparison; playback does not represent relative physical frequencies or speeds. The lesson compares the actual quartz spectrum."
"19":
  label: "Gaussian 빔의 폭과 휘어진 파면"
  note: "자유 공간의 근축 Gaussian 모형으로 빔의 허리와 퍼지는 파면을 그린 개념 애니메이션입니다. 실제 Meep 장이나 계면 계산이 아닙니다. 본문은 별도의 저장된 계면 계산을 다룹니다."
  label_en: "Gaussian waist and curved wavefronts"
  note_en: "A paraxial free-space Gaussian concept animation of the waist and spreading wavefronts. This is not Meep field data or an interface calculation; the lesson uses separate saved interface runs."
"21":
  label: "회전하는 액정 광축과 편광 회절"
  note: "액정 막의 광축이 y를 따라 yz 면에서 회전하는 설명용 개념 영상입니다. 원편광과 가능한 ±1차 방향을 보이며 회절각은 확대했습니다. 화살표는 전력 비율이나 실제 Meep 장이 아닙니다."
  label_en: "Rotating liquid-crystal axes and polarization diffraction"
  note_en: "A concept loop of liquid-crystal axes rotating in yz along y, with circular incidence and possible ±1 orders. Diffraction angles are exaggerated; arrows encode neither power fractions nor Meep fields."
"25":
  label: "원통 안의 흡수와 경계로 들어오는 전력"
  note: "2D 원통과 안쪽 flux 적분의 개념 애니메이션입니다. 높이·밝기·진행 속도는 설명용이며 실제 Meep 장이나 온도 계산이 아닙니다. 체적 흡수와 flux 검산은 본문의 저장된 결과로 확인합니다."
  label_en: "Cylinder absorption and inward boundary power"
  note_en: "A concept animation of a 2D cylinder and inward flux integration. Height, brightness and speed are illustrative, not Meep fields or temperature. Saved numerical results compare volume absorption and boundary power."
"26":
  label: "여섯 공기 구멍 사이의 결함 모드"
  note: "각 측면 3개 구멍, 반지름 0.36a와 중앙 간격 1.4a를 사용한 2D 구조의 개념 애니메이션입니다. 높이와 중앙 진동은 표시용이며 실제 Meep 장·Q·감쇠 적합이 아닙니다."
  label_en: "A defect mode between six air holes"
  note_en: "A concept loop of a 2D guide with three holes per side, radius 0.36a and central center-to-center spacing 1.4a. Display height and central oscillation are illustrative, not Meep fields, Q or a decay fit."
"27":
  label: "넓어지는 도파로와 입력 쪽 모드 모니터"
  note: "폭 1에서 2로 넓어지는 2D 도파로와 좁은 입력 쪽 모드 모니터를 그린 개념 애니메이션입니다. 화살표와 점은 방향만 나타내며 실제 모드·전력·Meep 장이 아닙니다."
  label_en: "A widening guide and its input-side modal monitor"
  note_en: "A concept loop of a 2D guide widening from width 1 to 2, with a modal monitor on the narrow input side. Arrows and markers show direction, not solved modes, power or Meep fields."
