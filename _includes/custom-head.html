<!-- MathJax: renders kramdown's $$ display math and inline $...$ -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: { inlineMath: [['$','$']], processEscapes: true,
               skipTags: ['script','noscript','style','textarea','pre','code'] },
    "HTML-CSS": { linebreaks: { automatic: true } }
  });
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS_CHTML"></script>
<style>
  .post-content img { max-width: 100%; height: auto; display: block; margin: 0.5em auto; }
  .post-content img + em { display: block; text-align: center; font-size: 0.9em; color: #555; margin-bottom: 1.5em; }
  .post-content table { font-size: 0.9em; }
  details { margin: 1em 0; } details summary { cursor: pointer; font-weight: 600; }
</style>
{% if page.layout == 'lesson' or page.layout == 'topic' %}
<link rel="stylesheet" href="{{ '/assets/lesson.css' | relative_url }}">
<script defer src="{{ '/assets/lesson.js' | relative_url }}"></script>
{% endif %}
